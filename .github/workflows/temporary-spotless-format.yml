name: Temporary Spotless Formatter
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply Spotless
        run: ./gradlew :app:spotlessApply
      - name: Export formatting patch
        run: git diff --binary > spotless-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: spotless-format-patch
          path: spotless-format.patch
          if-no-files-found: error
