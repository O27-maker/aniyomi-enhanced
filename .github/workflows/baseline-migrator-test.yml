name: Baseline migration test
on:
  push:
    branches:
      - baseline-migrator-check
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b
      - name: Run migration unit tests
        run: ./gradlew testReleaseUnitTest --tests mihon.core.migration.MigratorTest
