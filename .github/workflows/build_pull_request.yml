name: PR build check
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings-aniyomi.xml'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals-aniyomi.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings-aniyomi.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals-aniyomi.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37.0" "ndk;29.0.14206865"
          sdkmanager --list_installed | grep -E "platforms;android-37.0|ndk;29.0.14206865"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"

      - name: Provide legacy Android annotations jar for L8
        run: |
          mkdir -p "$ANDROID_HOME/tools/support" /tmp/empty-android-annotations
          jar --create --file "$ANDROID_HOME/tools/support/annotations.jar" -C /tmp/empty-android-annotations .

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Decode release keystore
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            echo "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/aniyomi-plus-release.jks"
          else
            echo "Permanent signing key is unavailable."
            exit 1
          fi

      - name: Build app
        env:
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/aniyomi-plus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify permanent APK signing certificate
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/aniyomi-plus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_SIGNING_KEY_PATH"
          expected_fingerprint="$(keytool -exportcert -keystore "$ANDROID_SIGNING_KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 5 ]]; then
            echo "Expected 5 APKs, found ${#apks[@]}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            output="$("$apksigner" verify --print-certs "$apk")"
            actual_fingerprint="$(printf '%s\\n' "$output" | grep -i 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*: //' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "Signing certificate mismatch for $apk"
              exit 1
            fi
            echo "Verified permanent signing certificate for $(basename "$apk")"
          done

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload installable APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installable-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
