name: Temporary dual-page formatter and validation
on:
  push:
    branches:
      - feature/dual-page-reading
permissions:
  contents: write
concurrency:
  group: dual-page-format-and-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/dual-page-reading
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b
      - name: Apply exact Spotless formatting
        run: ./gradlew spotlessApply
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Apply Spotless formatting"
            git push origin HEAD:feature/dual-page-reading
          fi
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Build release APKs
        run: ./gradlew assembleRelease
      - name: Run release unit tests
        run: ./gradlew testReleaseUnitTest
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-page-release-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-page-release-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
