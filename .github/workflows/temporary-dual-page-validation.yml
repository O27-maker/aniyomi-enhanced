name: Temporary dual-page dependency validation
on:
  push:
    branches:
      - feature/dual-page-reading
permissions:
  contents: read
concurrency:
  group: dual-page-dependency-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/dual-page-reading
      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: 17
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b
      - name: Verify formatting
        run: ./gradlew spotlessCheck
      - name: Build release APKs
        run: ./gradlew assembleRelease
      - name: Run release unit tests
        if: always()
        run: ./gradlew testReleaseUnitTest
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-page-release-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
